name: JuLiang Stable R2.6

on:
  workflow_dispatch:
  push:
    branches:
      - juliang-r2.6
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.js"
      - "**.css"
      - "**.html"
      - "**.sh"
      - "x-ui.service.debian"
      - "x-ui.service.arch"
      - "x-ui.service.rhel"
      - "x-ui.rc"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: juliang-r2.6
  cancel-in-progress: true

env:
  JULIANG_PANEL_VERSION: v2.9.3
  JULIANG_XRAY_VERSION: v26.4.25
  JULIANG_RELEASE_TAG: juliang-v2.9.3-r2.6

jobs:
  build:
    name: Build stable ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]

    steps:
      - name: Checkout locked source
        uses: actions/checkout@v6
        with:
          ref: juliang-r2.6

      - name: Verify locked source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'github.com/mhsanaei/3x-ui/v2' go.mod
          grep -q 'JULIANG_PANEL_VERSION="v2.9.3"' install.sh
          grep -q 'JULIANG_XRAY_VERSION="v26.4.25"' install.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build static panel
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH="${{ matrix.platform }}"
          case "${{ matrix.platform }}" in
            amd64) BOOTLIN_ARCH="x86-64" ;;
            arm64) BOOTLIN_ARCH="aarch64" ;;
          esac
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/${BOOTLIN_ARCH}/tarballs/"
          TARBALL_NAME=$(curl -fsSL --retry 5 --retry-all-errors "${TARBALL_BASE}" |
            grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" |
            sort -r | head -n1)
          test -n "${TARBALL_NAME}"
          cd /tmp
          curl -fLsS --retry 5 --retry-all-errors -o "${TARBALL_NAME}" "${TARBALL_BASE}/${TARBALL_NAME}"
          tar -xf "${TARBALL_NAME}"
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          export PATH="$(realpath "${TOOLCHAIN_DIR}")/bin:$PATH"
          export CC=$(realpath "$(find "${TOOLCHAIN_DIR}/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
          test -n "$CC"
          cd "$GITHUB_WORKSPACE"
          go build -trimpath -ldflags "-w -s -linkmode external -extldflags '-static'" -o xui-release main.go
          mkdir -p x-ui/bin
          install -m 755 xui-release x-ui/x-ui
          cp x-ui.sh x-ui/
          cp x-ui.service.debian x-ui/
          cp x-ui.service.arch x-ui/
          cp x-ui.service.rhel x-ui/

      - name: Add locked Xray core
        shell: bash
        run: |
          set -euo pipefail
          cd x-ui/bin
          XRAY_BASE="https://github.com/XTLS/Xray-core/releases/download/${JULIANG_XRAY_VERSION}"
          if [ "${{ matrix.platform }}" = "amd64" ]; then
            XRAY_ZIP="Xray-linux-64.zip"
          else
            XRAY_ZIP="Xray-linux-arm64-v8a.zip"
          fi
          curl -fLsS --retry 5 --retry-all-errors -O "${XRAY_BASE}/${XRAY_ZIP}"
          unzip -q "${XRAY_ZIP}"
          rm -f "${XRAY_ZIP}" geoip.dat geosite.dat
          mv xray "xray-linux-${{ matrix.platform }}"
          curl -fLsS --retry 5 --retry-all-errors -o geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fLsS --retry 5 --retry-all-errors -o geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat

      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          tar -zcf "x-ui-linux-${{ matrix.platform }}.tar.gz" x-ui
          sha256sum "x-ui-linux-${{ matrix.platform }}.tar.gz" > "x-ui-linux-${{ matrix.platform }}.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: juliang-stable-${{ matrix.platform }}
          path: |
            x-ui-linux-${{ matrix.platform }}.tar.gz
            x-ui-linux-${{ matrix.platform }}.tar.gz.sha256

  publish:
    name: Publish immutable stable release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: juliang-r2.6
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${JULIANG_RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Stable release ${JULIANG_RELEASE_TAG} already exists; refusing to overwrite it."
            exit 0
          fi
          git tag "${JULIANG_RELEASE_TAG}" "$GITHUB_SHA"
          git push origin "refs/tags/${JULIANG_RELEASE_TAG}"
          gh release create "${JULIANG_RELEASE_TAG}"             --target "$GITHUB_SHA"             --title "JuLiang-UI Stable R2.6 · v2.9.3 / Xray v26.4.25"             --notes "JuLiang stable R2.6. Based exactly on successful R2.5. Adds interactive installation prompts for custom panel username, password, WebBasePath, and optional panel port while preserving all R2.5 SK5 routing, Reality presets, Chinese management UI, duplicate-email handling, BBR + FQ, and locked Xray v26.4.25."             release-artifacts/*.tar.gz release-artifacts/*.sha256
