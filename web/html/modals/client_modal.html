{{define "modals/clientsModal"}}
<a-modal id="client-modal" v-model="clientModal.visible"
    :title="clientModal.title" @ok="clientModal.ok"
    :confirm-loading="clientModal.confirmLoading" :closable="true"
    :mask-closable="false"
    :class="themeSwitcher.currentTheme"
    :ok-text="clientModal.okText" cancel-text='{{ i18n "close" }}'>
    <template v-if="isEdit">
        <a-tag v-if="isExpiry || isTrafficExhausted" color="red"
            :style="{ marginBottom: '10px', display: 'block', textAlign: 'center' }">Account
            is (Expired|Traffic Ended) And Disabled</a-tag>
    </template>
    {{template "form/client"}}
</a-modal>
<script>

    const clientModal = {
        visible: false,
        confirmLoading: false,
        title: '',
        okText: '',
        isEdit: false,
        dbInbound: new DBInbound(),
        inbound: new Inbound(),
        clients: [],
        clientStats: [],
        oldClientId: "",
        index: null,
        clientIps: null,
        delayedStart: false,
        ok() {
            if (clientModal.isEdit) {
                ObjectUtil.execute(clientModal.confirm, clientModalApp.client, clientModal.dbInbound.id, clientModal.oldClientId);
            } else {
                clientModal.ensureUniqueEmail(clientModalApp.client, true);
                ObjectUtil.execute(clientModal.confirm, clientModalApp.client, clientModal.dbInbound.id);
            }
        },
        show({ title = '', okText = '{{ i18n "sure" }}', index = null, dbInbound = null, confirm = () => { }, isEdit = false }) {
            this.visible = true;
            this.title = title;
            this.okText = okText;
            this.isEdit = isEdit;
            this.dbInbound = new DBInbound(dbInbound);
            this.inbound = Inbound.fromJson(dbInbound.toInbound().toJson());
            this.clients = this.inbound.clients;
            this.index = index === null ? this.clients.length : index;
            this.delayedStart = false;
            if (isEdit) {
                if (this.clients[index].expiryTime < 0) {
                    this.delayedStart = true;
                }
                this.oldClientId = this.getClientId(dbInbound.protocol, clients[index]);
            } else {
                this.addClient(this.inbound, this.clients);
            }
            this.clientStats = this.dbInbound.clientStats.find(row => row.email === this.clients[this.index].email);
            this.confirm = confirm;
        },  
        getClientId(protocol, client) {
            switch (protocol) {
                case Protocols.TROJAN: return client.password;
                case Protocols.SHADOWSOCKS: return client.email;
                case Protocols.HYSTERIA: return client.auth;
                default: return client.id;
            }
        },
        getUsedEmails() {
            const used = new Set();
            try {
                (app.dbInbounds || []).forEach(db => {
                    const inbound = db.toInbound();
                    (inbound.clients || []).forEach(c => {
                        if (c && c.email) used.add(String(c.email).toLowerCase());
                    });
                });
            } catch (e) {
                console.warn('JuLiang: unable to collect used client emails', e);
            }
            return used;
        },
        ensureUniqueEmail(client, notify = false) {
            if (!client) return client;
            const used = this.getUsedEmails();
            const original = String(client.email || '').trim();
            let email = original || RandomUtil.randomLowerAndNum(8);

            if (used.has(email.toLowerCase())) {
                const base = original || 'client';
                let n = 2;
                let candidate = base + '-' + n;
                while (used.has(candidate.toLowerCase()) && n < 10000) {
                    n++;
                    candidate = base + '-' + n;
                }
                email = candidate;
                if (notify && typeof app !== 'undefined' && app.$message) {
                    app.$message.warning('客户端名称已存在，已自动改为：' + email);
                }
            }

            client.email = email;
            return client;
        },
        regenerateUniqueEmail(client) {
            if (!client) return;
            const used = this.getUsedEmails();
            let email = '';
            do {
                email = RandomUtil.randomLowerAndNum(9);
            } while (used.has(email.toLowerCase()));
            client.email = email;
        },
        addClient(inbound, clients) {
            let client = null;
            switch (inbound.protocol) {
                case Protocols.VMESS:
                    client = new Inbound.VmessSettings.VMESS();
                    break;
                case Protocols.VLESS:
                    client = new Inbound.VLESSSettings.VLESS();
                    break;
                case Protocols.TROJAN:
                    client = new Inbound.TrojanSettings.Trojan();
                    break;
                case Protocols.SHADOWSOCKS:
                    client = new Inbound.ShadowsocksSettings.Shadowsocks(
                        clients[0].method,
                        RandomUtil.randomShadowsocksPassword(inbound.settings.method)
                    );
                    break;
                case Protocols.HYSTERIA:
                    client = new Inbound.HysteriaSettings.Hysteria();
                    break;
                default:
                    return null;
            }
            this.ensureUniqueEmail(client);
            return clients.push(client);
        },
        close() {
            clientModal.visible = false;
            clientModal.loading(false);
        },
        loading(loading=true) {
            clientModal.confirmLoading = loading;
        },
    };

    const clientModalApp = new Vue({
        delimiters: ['[[', ']]'],
        el: '#client-modal',
        data: {
            clientModal,
            get inbound() {
                return this.clientModal.inbound;
            },
            get client() {
                return this.clientModal.clients[this.clientModal.index];
            },
            get clientStats() {
                return this.clientModal.clientStats;
            },
            get isEdit() {
                return this.clientModal.isEdit;
            },
            get datepicker() {
                return app.datepicker;
            },
            get isTrafficExhausted() {
                if (!this.clientStats) return false
                if (this.clientStats.total <= 0) return false
                if (this.clientStats.up + this.clientStats.down < this.clientStats.total) return false
                return true
            },
            get isExpiry() {
                return this.clientModal.isEdit && this.client.expiryTime >0 ? (this.client.expiryTime < new Date().getTime()) : false;
            },
            get delayedStart() {
                return this.clientModal.delayedStart;
            },
            set delayedStart(value) {
                this.clientModal.delayedStart = value;
            },
            get delayedExpireDays() {
                return this.client && this.client.expiryTime < 0 ? this.client.expiryTime / -86400000 : 0;
            },
            set delayedExpireDays(days) {
                this.client.expiryTime = -86400000 * days;
            },
        },
        methods: {
            async getDBClientIps(email) {
                const msg = await HttpUtil.post(`/panel/api/inbounds/clientIps/${email}`);
                if (!msg.success) {
                    document.getElementById("clientIPs").value = msg.obj;
                    return;
                }
                let ips = msg.obj;
                if (typeof ips === 'string' && ips.startsWith('[') && ips.endsWith(']')) {
                    try {
                        ips = JSON.parse(ips);
                        ips = Array.isArray(ips) ? ips.join("\n") : ips;
                    } catch (e) {
                        console.error('Error parsing JSON:', e);
                    }
                }
                document.getElementById("clientIPs").value = ips;
            },
            async clearDBClientIps(email) {
                try {
                    const msg = await HttpUtil.post(`/panel/api/inbounds/clearClientIps/${email}`);
                    if (!msg.success) {
                        return;
                    }
                    document.getElementById("clientIPs").value = "";
                } catch (error) {
                }
            },
            resetClientTraffic(email, dbInboundId, iconElement) {
                this.$confirm({
                    title: '{{ i18n "pages.inbounds.resetTraffic"}}',
                    content: '{{ i18n "pages.inbounds.resetTrafficContent"}}',
                    class: themeSwitcher.currentTheme,
                    okText: '{{ i18n "reset"}}',
                    cancelText: '{{ i18n "cancel"}}',
                    onOk: async () => {
                        iconElement.disabled = true;
                        const msg = await HttpUtil.postWithModal('/panel/api/inbounds/' + dbInboundId + '/resetClientTraffic/' + email);
                        if (msg.success) {
                            this.clientModal.clientStats.up = 0;
                            this.clientModal.clientStats.down = 0;
                        }
                        iconElement.disabled = false;
                    },
                })
            },
        },
    });

</script>
{{end}}
